<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 50" width="190" height="50"><style>
.m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.s{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1530"/><stop offset="1" stop-color="#060914"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#c084fc"><animate attributeName="stop-color" values="#c084fc;#f472b6;#c084fc" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
