<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 474 200" width="474" height="200" role="img">
<style>
.m{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
.s{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1530"/><stop offset="1" stop-color="#060914"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#6366f1"/><stop offset="1" stop-color="#c084fc"><animate attributeName="stop-color" values="#c084fc;#f472b6;#c084fc" dur="6s" repeatCount="indefinite"/></stop></linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#2e2a7a"/></linearGradient>
<linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#4a1d8f"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#6366f1" stop-opacity=".45"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1a2547" stroke-width="1" opacity=".55"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
<filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<defs><linearGradient id="a4" x1="0" x2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#c084fc"/></linearGradient></defs>
<rect x="10" y="12" width="460" height="176" rx="18" fill="#f472b6" opacity=".28"/>
<g filter="url(#shadow)"><rect x="2" y="2" width="460" height="176" rx="18" fill="url(#bg)" stroke="#2a3a6b"/></g>
<rect x="2" y="2" width="460" height="5" rx="2.5" fill="url(#a4)"/>
<rect x="2" y="2" width="90" height="5" rx="2.5" fill="#fff" opacity=".7"><animate attributeName="x" values="2;372;2" dur="4s" repeatCount="indefinite"/></rect>
<g transform="translate(34,50)"><rect x="-16" y="-16" width="40" height="40" rx="11" fill="#f472b6" opacity=".18"/><path d="M-6 -4 l-8 8 8 8 M14 -4 l8 8 -8 8" transform="translate(-2,-4) scale(.75)" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="76" y="50" class="s" font-size="21" font-weight="800" fill="#f1f5f9">Image Gallery</text>
<text x="76" y="58" class="s" font-size="1" fill="none"> </text>
<text x="34" y="98" class="s" font-size="14" fill="#94a3b8">Responsive, modern image gallery with</text>
<text x="34" y="119" class="s" font-size="14" fill="#94a3b8">a clean grid layout for every screen.</text>
<circle cx="40" cy="150" r="6" fill="#fb923c"/><text x="54" y="155" class="m" font-size="13" fill="#cbd5e1">HTML</text>
<text x="428" y="155" text-anchor="end" class="m" font-size="13" font-weight="700" fill="#f472b6" letter-spacing="1">VIEW PROJECT →</text>
